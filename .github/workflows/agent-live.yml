# LIVE WHISTLE loop — match monitoring every 10 minutes (kick-offs, goals, FT).
# Scheduled workflows run on the repository's default branch.
name: agent-live

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# All agent workflows share one concurrency group so they never write
# state (the SQLite DB) at the same time.
concurrency:
  group: tffw-state
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run live match pipeline
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          PUBLISH_ROLE: backstop
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID || '6a2c2db338b55793458b2052' }}
          PUBLISHER: ${{ vars.PUBLISHER || 'buffer' }}
          DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
          COMPETITIONS: ${{ vars.COMPETITIONS || 'PL,CL,WC' }}
        run: |
          echo "buffer secret present: ${BUFFER_ACCESS_TOKEN:+yes} (len ${#BUFFER_ACCESS_TOKEN})"
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          python -m tffw.main live
          # push freshly-rendered media BEFORE publishing so story/reel URLs are
          # live on the CDN this same run (otherwise stories 404 and slip to the
          # next 5-min cron — the cause of multi-minute live delays)
          git add data output dashboard assets
          if ! git diff --cached --quiet; then
            git commit -q -m "agent: live media $(date -u +%FT%TZ)"
            git push -q 2>/dev/null || { git pull --rebase -X theirs >/dev/null 2>&1 && git push -q 2>/dev/null; } || true
          fi
          python -m tffw.main publish

      - name: Commit state, media and dashboard
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add data output dashboard
          git diff --cached --quiet && exit 0
          git commit -m "agent: live run $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs || { git rebase --abort || true; git reset --hard "origin/${GITHUB_REF_NAME}"; exit 0; }
          done
